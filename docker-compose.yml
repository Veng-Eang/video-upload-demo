services:
  otel-collector:
    image: otel/opentelemetry-collector
    restart: always
    volumes:
      - ./docker/otel-collector/otel-collector-config.yml:/etc/otelcol/config.yml
    command:
      - "--config=/etc/otelcol/config.yml"
    ports:
      - "1888:1888" # pprof extension
      - "8888:8888" # Prometheus metrics exposed by the Collector
      - "8889:8889" # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
      - "55679:55679" # zpages extension
    depends_on:
      - jaeger-all-in-one
      - zipkin-all-in-one
  prometheus:
    container_name: prometheus-test
    image: prom/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - "./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
  grafana:
    container_name: grafana-test
    image: grafana/grafana
    ports:
      - "3000:3000"
#  backenddemo:
#    image: video_upload_demo:latest
#    ports:
#      - "8091:8091"
#    environment:
#      - SPRING_PROFILES_ACTIVE=dev
#      - LMS_VIDEO_UPLOAD_DIR=/lms/uploads
#      - LMS_VIDEO_HLS_OUTPUT_DIR=/lms/hls
#      - LMS_VIDEO_FFMPEG_BINARY=/usr/bin/ffmpeg
  mongodbdemo:
    image: mongo:latest
    container_name: mongodb-test
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=vengeang
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=backend-demo
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268"
      - "14250"
  zipkin-all-in-one:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"