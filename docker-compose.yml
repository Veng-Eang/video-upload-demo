services:
  prometheus:
    container_name: prometheus-test
    image: prom/prometheus
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - "./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
  grafana:
    container_name: grafana-test
    image: grafana/grafana
    ports:
      - "3000:3000"
  backenddemo:
    image: video_upload_demo:latest
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LMS_VIDEO_UPLOAD_DIR=/lms/uploads
      - LMS_VIDEO_HLS_OUTPUT_DIR=/lms/hls
      - LMS_VIDEO_FFMPEG_BINARY=/usr/bin/ffmpeg
  mongodbdemo:
    image: mongo:latest
    container_name: mongodb-test
    ports:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=vengeang
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=backend
